# Bayes classifier (Phase B2 iteration). Tokens live in the shared redis
# (servers from local.d/redis.conf); expire bounds key growth there.
# autolearn stays OFF — the hourly feeder posts explicit, precise verdicts
# (Gmail's own spam-folder judgments + our scored ham); autolearn on top of
# that can poison the classifier with borderline mail.
backend = "redis";
new_schema = true;
per_user = false;
autolearn = false;
# BAYES_* symbols only fire once BOTH classes have this many learns. Spam-side
# corpus = the live Gmail spam folders (~30-day retention), volume unknown at
# ship time — 100 keeps the bar reachable; revisit upward once learns
# accumulate (check: curl 127.0.0.1:11334/stat).
min_learns = 100;
# ~100 days token TTL.
expire = 8640000;
