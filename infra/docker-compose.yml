# Phase 3 — base services stack.
# Lives on the droplet at /srv/memory/docker-compose.yml
# Run with:
#   docker compose --env-file /srv/memory/secrets/.env up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/memory/data/postgres:/var/lib/postgresql/data
    # Bind to 127.0.0.1 only — host-only access for systemd-run ingesters and
    # workers that aren't on the docker `internal` network. UFW + DO firewall
    # still block public 5432 even if this were 0.0.0.0, but belt + suspenders.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /srv/memory/data/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN_MCP: ${CADDY_DOMAIN_MCP}
      CADDY_EMAIL: ${CADDY_EMAIL}
      # Forwarded to Caddy for header-based bearer auth on the MCP route.
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
      # Shared secret Caddy injects (X-Proxy-Secret) on Authelia-authenticated
      # merge requests so merge_api trusts the Remote-Groups identity.
      MERGE_PROXY_SECRET: ${MERGE_PROXY_SECRET}
    # host.docker.internal → the web-bridge gateway IP (= the host on this
    # docker bridge). Docker's built-in `:host-gateway` resolves to the
    # default-bridge gateway (172.17.0.1) regardless of which network the
    # container is on, which isn't reachable from a custom bridge. Pinning
    # the `web` network subnet (below) makes this IP stable.
    extra_hosts:
      - "host.docker.internal:172.31.0.1"
    volumes:
      - /srv/memory/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/memory/data/caddy:/data
      - /srv/memory/data/caddy-config:/config
      - /srv/memory/sites:/srv/sites:ro
    networks:
      - web

  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
    volumes:
      - /srv/memory/authelia:/config
    networks:
      - internal
      - web

networks:
  internal:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
