[project]
name = "memory-gmail"
version = "0.1.0"
description = "Live Gmail sync (multi-account OAuth) for the personal memory system."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]          # make the `gmail` package importable (package=false)
testpaths = ["tests"]
