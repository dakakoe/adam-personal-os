[project]
name = "memory-whatsapp-import"
version = "0.1.0"
description = "One-shot WhatsApp history import from an iPhone local backup. Runs on the Mac, not the droplet."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
