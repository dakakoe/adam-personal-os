[project]
name = "memory-mcp"
version = "0.1.0"
description = "MCP server exposing the personal contact-memory store to Claude clients."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "asyncpg>=0.29",
    "uvicorn>=0.30",
    # Semantic search: encode the user's query with the same model the
    # embedder used (multilingual-e5-base) so cosine distance is meaningful.
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "pgvector>=0.3",
    # local_ask: private RAG answered by the on-box Ollama (Personal OS Phase 5).
    "httpx>=0.27",
]

[tool.uv]
package = false
